name: Build Positive Characteristic Resolution 147

on:
  push:
    branches:
      - tmp-positive-characteristic-resolution-147
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize example delta and run exact regressions
        working-directory: positive_characteristic_resolution_147
        run: |
          python finalize_patch.py
          cp progress147_calc_compact.py progress147_calc.py
          python progress147_calc.py > progress147_calc_output.txt
          tail -n 20 progress147_calc_output.txt
          grep -q '^ALL_E_147_CHECKS_PASS$' progress147_calc_output.txt

      - name: Compile the full Chinese PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: progress147_full_derivation.tex
          working_directory: positive_characteristic_resolution_147
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode -file-line-error -halt-on-error

      - name: Build validation reports and bundle
        working-directory: positive_characteristic_resolution_147
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          from pypdf import PdfReader
          root=Path('.')
          out=(root/'progress147_calc_output.txt').read_text(encoding='utf-8')
          m=re.search(r'TOTAL_ASSERTIONS=(\d+)',out)
          assert m and 'ALL_E_147_CHECKS_PASS' in out
          assertions=int(m.group(1))
          pages=len(PdfReader(str(root/'progress147_full_derivation.pdf')).pages)
          entries=[json.loads(x) for x in (root/'example_library_147_patch.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          ids=[e['id'] for e in entries]; hashes=[e['canonical_hash'] for e in entries]
          assert len(entries)==10 and len(ids)==len(set(ids)) and len(hashes)==len(set(hashes))
          quality=f'''Round 147 quality report
          - Theory: D-147-01--03, L-147-01--04, T-147-01--02, X-147-01--03, C-147-01 and G-147-01--05 are fully stated with dependencies and scope restrictions.
          - Significant-progress gate: passed by the first positive-dimensional relative residual certificate tier in arbitrary ambient dimension, the relative Hoskin--Deligne bundle rank, degree-weighted root splitting, finite-etale orbit-center descent, and two independent information-loss counterexamples.
          - Computation: {assertions} exact Python assertions passed; output ends ALL_E_147_CHECKS_PASS.
          - Example library: compositional v4.4 = immutable v4.3 base (274 entries) + Round-147 delta (10 entries), expected merged total 284; delta IDs and canonical hashes are unique.
          - PDF: {pages} A4 flow-layout pages, generated by two-pass xelatex/latexmk from progress147_full_derivation.tex.
          - Baseline: Round 147 is stored as a canonical append-only delta to the existing 0.0--146.0 master plus the 145.0 strategic layer; no older G/X/retraction entry is removed.
          - Singular: optional script generated; this workflow does not install Singular, so no Singular verification claim.
          - Truth boundary: arbitrary-dimensional positive-characteristic resolution remains open; FERCC effectivity, cluster boundary, ramification, Frobenius/kangaroo and imperfect-field descent remain typed gaps.
          '''
          (root/'progress147_quality_report.txt').write_text('\n'.join(x.strip() for x in quality.splitlines())+'\n',encoding='utf-8')
          lines=['# Round 147 example-library delta\n']
          for e in entries:
              lines += [f"## {e['id']} - {e['title']}",f"- Status: `{e['status']}`",f"- Data: `{e['equation_or_data']}`",f"- Behavior: {e['observed_behavior']}",f"- Certificate/failure: `{e['certificate_or_failure']}`",f"- Canonical hash: `{e['canonical_hash']}`",'']
          (root/'example_library_147_patch.md').write_text('\n'.join(lines),encoding='utf-8')
          keep=[p for p in root.iterdir() if p.is_file() and p.name not in {'progress147_calc.py.bak'}]
          sums=[]
          for p in sorted(keep):
              sums.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n',encoding='utf-8')
          print(f'PAGES={pages}')
          print(f'ASSERTIONS={assertions}')
          PY
          zip -9 -r positive_characteristic_resolution_round_147_bundle.zip \
            progress147_report.md progress147_full_derivation.tex progress147_full_derivation.pdf \
            progress147_calc.py progress147_calc_output.txt progress147_check.sing \
            finalize_patch.py example_library_147_patch.jsonl example_library_147_patch.md \
            example_library_v4_4_manifest.md merge_example_library_147.py \
            positive_characteristic_resolution_master_memory_147_delta.md RSF_v147.md \
            progress147_sources.md progress147_quality_report.txt SHA256SUMS.txt

      - name: Upload Round 147 artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: positive-characteristic-resolution-round-147
          path: |
            positive_characteristic_resolution_147/progress147_full_derivation.pdf
            positive_characteristic_resolution_147/progress147_report.md
            positive_characteristic_resolution_147/progress147_full_derivation.tex
            positive_characteristic_resolution_147/progress147_calc.py
            positive_characteristic_resolution_147/progress147_calc_output.txt
            positive_characteristic_resolution_147/progress147_check.sing
            positive_characteristic_resolution_147/example_library_147_patch.jsonl
            positive_characteristic_resolution_147/example_library_147_patch.md
            positive_characteristic_resolution_147/example_library_v4_4_manifest.md
            positive_characteristic_resolution_147/merge_example_library_147.py
            positive_characteristic_resolution_147/positive_characteristic_resolution_master_memory_147_delta.md
            positive_characteristic_resolution_147/RSF_v147.md
            positive_characteristic_resolution_147/progress147_sources.md
            positive_characteristic_resolution_147/progress147_quality_report.txt
            positive_characteristic_resolution_147/SHA256SUMS.txt
            positive_characteristic_resolution_147/positive_characteristic_resolution_round_147_bundle.zip
          retention-days: 7
